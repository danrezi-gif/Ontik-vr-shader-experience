name: Deploy to GitHub Pages

# Deploys run from main only (github-pages environment restriction).
# After pushing to the experimental branch, trigger this workflow on main
# via workflow_dispatch to refresh /exp.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Experimental build published under /exp while the stable site stays at /.
  # Remove this branch (and the exp steps) once the journey version is promoted.
  EXP_BRANCH: claude/vr-psychedelic-experience-6q0bzx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Checkout experimental
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXP_BRANCH }}
          path: experimental

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build stable site (served at /)
        working-directory: stable
        run: |
          npm install
          npm run build

      - name: Build experimental site (served at /exp)
        working-directory: experimental
        run: |
          npm install
          npx vite build --base=/exp/

      - name: Combine sites
        run: |
          mkdir -p stable/dist/public/exp
          cp -r experimental/dist/public/. stable/dist/public/exp/
          rm -f stable/dist/public/exp/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './stable/dist/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

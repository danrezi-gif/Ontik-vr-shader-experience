<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Night Desert</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.0/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.brush@2.0.0/dist/p5.brush.min.js"></script>
<script>
new p5(function(p) {

  p.setup = function() {
    let cnv = p.createCanvas(900, 600, p.WEBGL);
    p.noLoop();
    p.randomSeed(42);
    p.noiseSeed(42);

    brush.load(p);
    p.translate(-p.width / 2, -p.height / 2);

    // ── Sky ──────────────────────────────────────────────────────────────────
    // Deep night gradient: draw horizontal bands with watercolor washes
    brush.set("watercolor", "#0a0a1a", 1);
    brush.noStroke();
    for (let y = 0; y < 360; y += 6) {
      let t   = y / 360;
      let r   = p.lerp(10,  25, t);
      let g   = p.lerp(10,  18, t);
      let b   = p.lerp(26,  55, t);
      let col = p.color(r, g, b);
      brush.fill(p.color(p.red(col), p.green(col), p.blue(col)), 0.18);
      brush.rect(0, y, p.width, 7);
    }

    // ── Stars ────────────────────────────────────────────────────────────────
    brush.noFill();
    for (let i = 0; i < 280; i++) {
      let sx   = p.random(p.width);
      let sy   = p.random(0, 340);
      let size = p.random(0.3, 2.2);
      let bright = p.random(180, 255);
      brush.set("marker", p.color(bright, bright, bright + 20), size * 0.3);
      brush.line(sx, sy, sx + p.random(-0.5, 0.5), sy + p.random(-0.5, 0.5));
    }

    // ── Crescent Moon ────────────────────────────────────────────────────────
    let mx = 680, my = 80, mr = 42;
    brush.set("watercolor", "#f5e8c0", 1);
    brush.fill(p.color(245, 232, 192), 0.55);
    brush.noStroke();
    brush.circle(mx, my, mr);

    // Occlude with dark overlay circle to carve the crescent
    brush.fill(p.color(12, 12, 28), 0.92);
    brush.circle(mx + 18, my - 8, mr * 0.85);

    // Soft glow halo around moon
    brush.set("watercolor", "#d4c47a", 1);
    brush.fill(p.color(212, 196, 122), 0.08);
    brush.noStroke();
    brush.circle(mx, my, mr * 2.8);

    // ── Distant dunes silhouette (far layer) ─────────────────────────────────
    // Use charcoal with a very dark indigo
    brush.set("charcoal", "#1a1a3a", 1);
    brush.noStroke();
    brush.fill(p.color(20, 18, 45), 0.9);

    // Build far dune polygon
    let farDune = [];
    farDune.push([0, p.height]);
    farDune.push([0, 300]);
    let steps = 60;
    for (let i = 0; i <= steps; i++) {
      let x = (i / steps) * p.width;
      let baseY = 300;
      let y = baseY
        + p.noise(i * 0.06, 1) * 60
        - p.noise(i * 0.12, 2) * 30;
      farDune.push([x, y]);
    }
    farDune.push([p.width, p.height]);
    brush.polygon(farDune);

    // ── Mid dunes ────────────────────────────────────────────────────────────
    brush.set("charcoal", "#0f0f20", 1);
    brush.fill(p.color(12, 10, 28), 0.95);

    let midDune = [];
    midDune.push([0, p.height]);
    midDune.push([0, 360]);
    for (let i = 0; i <= steps; i++) {
      let x = (i / steps) * p.width;
      let y = 370
        + p.noise(i * 0.07, 5) * 70
        - p.noise(i * 0.15, 6) * 25;
      midDune.push([x, y]);
    }
    midDune.push([p.width, p.height]);
    brush.polygon(midDune);

    // ── Foreground dune (large, warm-tinted sand) ────────────────────────────
    brush.set("charcoal", "#1b1208", 1);
    brush.fill(p.color(22, 14, 8), 1.0);

    let fgDune = [];
    fgDune.push([0, p.height]);
    fgDune.push([-10, 460]);
    for (let i = 0; i <= steps; i++) {
      let x = (i / steps) * p.width;
      let y = 430
        + p.noise(i * 0.05, 10) * 90
        - p.noise(i * 0.1,  11) * 30
        + Math.sin(i * 0.18) * 20;
      fgDune.push([x, y]);
    }
    fgDune.push([p.width + 10, p.height]);
    brush.polygon(fgDune);

    // ── Moonlight rim highlight on foreground dune ───────────────────────────
    brush.set("2B", "#4a3c2a", 1);
    brush.noFill();
    for (let i = 0; i < steps - 1; i++) {
      let x0 = (i / steps) * p.width;
      let x1 = ((i + 1) / steps) * p.width;
      let y0 = 430 + p.noise(i * 0.05, 10) * 90 - p.noise(i * 0.1, 11) * 30 + Math.sin(i * 0.18) * 20;
      let y1 = 430 + p.noise((i+1) * 0.05, 10) * 90 - p.noise((i+1) * 0.1, 11) * 30 + Math.sin((i+1) * 0.18) * 20;
      brush.set("2B", p.color(80 + p.random(20), 65 + p.random(15), 45 + p.random(10)), p.random(0.4, 0.9));
      brush.line(x0, y0, x1, y1);
    }

    // ── Wind-blown sand streaks ───────────────────────────────────────────────
    brush.set("marker", "#2a1e0e", 1);
    for (let i = 0; i < 35; i++) {
      let sx  = p.random(p.width);
      let sy  = p.random(450, 590);
      let len = p.random(30, 120);
      brush.set("marker", p.color(40 + p.random(20), 28 + p.random(15), 12 + p.random(10)), p.random(0.2, 0.5));
      brush.line(sx, sy, sx + len, sy + p.random(-4, 4));
    }

    // ── Sparse desert scrub silhouettes ─────────────────────────────────────
    brush.set("charcoal", "#0a0a15", 1);
    brush.noFill();
    let shrubPositions = [
      [130, 462], [310, 448], [520, 455], [730, 442], [860, 458]
    ];
    for (let [sx, sy] of shrubPositions) {
      sx += p.random(-15, 15);
      sy += p.random(-5, 5);
      let h = p.random(12, 28);
      brush.set("charcoal", p.color(8, 8, 18), p.random(0.6, 1));
      // Stem
      brush.line(sx, sy, sx, sy - h);
      // Branches
      for (let b = 0; b < p.floor(p.random(3, 6)); b++) {
        let angle = p.random(-p.PI * 0.6, p.PI * 0.6);
        let blen  = p.random(5, 14);
        let bx    = sx + Math.sin(angle) * blen;
        let by    = sy - p.random(h * 0.3, h) + Math.cos(angle) * blen * 0.3;
        brush.line(sx, sy - h * 0.5, bx, by);
      }
    }

    // ── Subtle moon reflection on sand ──────────────────────────────────────
    brush.set("watercolor", "#c8b060", 1);
    brush.fill(p.color(200, 176, 96), 0.04);
    brush.noStroke();
    brush.circle(mx - 30, 500, 180);
  };

});
</script>
</body>
</html>
